version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ifam_eventos_postgres
    restart: always
    environment:
      POSTGRES_USER: ifam_user
      POSTGRES_PASSWORD: ifam_password_2026
      POSTGRES_DB: ifam_eventos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ifam_eventos_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
